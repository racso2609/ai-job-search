# AI Job Search — background service.
#
#   cp service/.env.example service/.env   # fill in your values
#   docker compose -f service/docker-compose.yml up -d --build
#   docker compose -f service/docker-compose.yml logs -f
#
# Build context is the repo root so the image can COPY the whole framework.

services:
  job-search:
    build:
      context: ..
      dockerfile: service/Dockerfile
      args:
        # Match the host user so the bind mount is not written as root.
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: ai-job-search:local
    container_name: ai-job-search
    restart: unless-stopped
    # Same uid/gid as the host user that owns the repo.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
      HOME: /home/app
    volumes:
      # Persist generated profile data, state, CVs, tracker across restarts.
      - ..:/workspace
      # Cache opencode's provider auth / data between runs.
      - opencode-data:/home/app/.local/share/opencode
    # No ports: the daemon only makes outbound calls (Telegram long-poll).

volumes:
  opencode-data:
